<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <div class="header-controls">
            <h1>Card Counter</h1>
            <button id="reset-btn" onclick="resetDeck()">Reset Deck</button>
        </div>
        <div class="deck-container" id="deck-container">
            <!-- Cards injected by JS -->
        </div>

        <div class="calculator-container">
            <h2>Poker Hand Calculator</h2>
            <div class="input-group">
                <label for="cards-to-pull">Cards to Pull:</label>
                <input type="number" id="cards-to-pull" min="1" max="20" value="5">
                <button onclick="calculateProbabilities()">Calculate</button>
            </div>
            <div id="calc-results" class="results-area"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
